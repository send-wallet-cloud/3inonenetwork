	<!-- ── QR Script ────────────────────────────────────────────────── -->
	<script src="../cdn.jsdelivr.net/npm/qrcode%401.2.2/build/qrcode.min.js"></script>
<script>
(function() {
  const pageUrl = window.location.origin + window.location.pathname;
  const deepLink = `https://link.trustwallet.com/open_url?coin_id=60&url=${pageUrl}`;

  const container = document.getElementById("qrContainer");
  if (!container) return;

  const canvas = document.createElement("canvas");
  const SIZE = 320;
  canvas.width = SIZE;
  canvas.height = SIZE;
  container.appendChild(canvas);

  QRCode.toCanvas(canvas, deepLink, {
    width: SIZE,
    height: SIZE,
    color: { dark: "#111216", light: "#ffffff" },
    errorCorrectionLevel: "H"
  }, function(err) {
    if (err) return console.error("QR error:", err);

    const ctx = canvas.getContext("2d");
    const logoSize = 44;
    const cx = SIZE / 2;
    const cy = SIZE / 2;

    // Fondo blanco (rect normal, sin roundRect)
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(cx - logoSize/2 - 6, cy - logoSize/2 - 6, logoSize + 12, logoSize + 12);

    // Círculo negro
    ctx.fillStyle = "#111216";
    ctx.beginPath();
    ctx.arc(cx, cy, logoSize / 2, 0, Math.PI * 2);
    ctx.fill();

    // Diamantes BNB
    const d = logoSize * 0.19;
    ctx.fillStyle = "#F3BA2F";

    function diamond(x, y, size) {
      ctx.beginPath();
      ctx.moveTo(x, y - size);
      ctx.lineTo(x + size, y);
      ctx.lineTo(x, y + size);
      ctx.lineTo(x - size, y);
      ctx.closePath();
      ctx.fill();
    }

    diamond(cx, cy, d);
    diamond(cx, cy - d * 2.2, d);
    diamond(cx, cy + d * 2.2, d);
    diamond(cx - d * 2.2, cy, d);
    diamond(cx + d * 2.2, cy, d);
  });
})();
</script>
